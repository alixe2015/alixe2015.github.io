{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info">
    <header class="entry-header">
        <h1>{{ .Title | markdownify }}</h1>
    </header>
    <div class="entry-content">
        {{ .Content | markdownify }}
    </div>
    <footer class="entry-footer">
        {{ partial "social_icons.html" site.Params.socialIcons }}
    </footer>
</article>
{{- end }}

<section class="flying-demo" aria-labelledby="flying-demo-title">
    <h2 id="flying-demo-title">Interactive Flying Button</h2>
    <p>Hover to ignite the thrusters, then click to launch.</p>
    <iframe
        class="flying-demo__frame"
        src="{{ "flying-button/" | relURL }}"
        title="React Bits FlyingButton interactive demo"
        loading="lazy"
        allow="fullscreen"
        height="440"
    ></iframe>
</section>
